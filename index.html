<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>La Tournée</title>
<meta name="description" content="Le jeu de plateau de soirée : l’écran au milieu, vos téléphones en manette.">
<meta name="theme-color" content="#140E22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<style>
:root{--bg:#140E22;--bg2:#1B1430;--panel:#251B3D;--panel2:#30244D;--line:#43345F;--fg:#F7F0FF;--mut:#ADA0CB;--acc:#FF4F8B;--gold:#FFC23D;--cyan:#3DE0D0;--red:#FF5A5A;--blue:#4F8BFF;--green:#3DDC84;--vio:#B07CFF;--org:#FF8A3D;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow:hidden}
h1,h2,h3,h4,.logo{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:700;color:var(--fg);text-decoration:none;user-select:none;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(255,79,139,.35)}
.btn.big{padding:16px 22px;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.fine{color:var(--mut);font-size:13px}
.screen{position:fixed;inset:0;overflow:auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left));background:radial-gradient(1200px 700px at 20% -10%,#3a1d4f 0%,transparent 60%),radial-gradient(900px 600px at 100% 110%,#1c2f55 0%,transparent 60%),var(--bg)}
.logo{font-weight:800;font-size:clamp(52px,10vw,112px);letter-spacing:-.02em;background:linear-gradient(90deg,#FF4F8B,#FFC23D);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,79,139,.35))}
.logo.sm{font-size:30px}
.mwrap{max-width:560px;margin:5vh auto 0;display:flex;flex-direction:column;gap:18px}
.mbtns{display:flex;flex-direction:column;gap:10px}
.tagl{font-size:19px;color:var(--mut)}
.pagew{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pagew h1{font-size:44px}
.pagew h3{font-size:22px;margin-top:8px}
.pagew ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lobby{display:flex;flex-direction:column;gap:16px}
.lgrid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;max-width:1200px;width:100%;margin:0 auto}
@media (max-width:820px){.lgrid{grid-template-columns:1fr}}
.lcol{background:rgba(37,27,61,.72);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lcol h2{font-size:28px}
.qr{background:#fff;border-radius:16px;padding:10px;width:230px;height:230px;align-self:center;display:grid;place-items:center;color:#140E22;text-align:center;font-size:13px}
.qr img{width:100%;height:100%;image-rendering:pixelated}
.url{text-align:center;font-weight:700;word-break:break-all;font-size:15px}
.code{text-align:center;font-size:15px;color:var(--mut)}.code b{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;letter-spacing:.14em;color:var(--gold);display:block;line-height:1}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:8px 10px}
.pn{flex:1;min-width:0}.pn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pn small{color:var(--mut)}
.x{color:var(--mut);font-size:18px;padding:6px 10px;border-radius:10px}.x:hover{background:var(--panel2);color:var(--fg)}
.av{--c:#888;width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;background:var(--panel2);box-shadow:0 0 0 3px var(--c);overflow:hidden;font-size:24px;flex:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:28px;height:28px;font-size:16px;box-shadow:0 0 0 2px var(--c)}
.lab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.chip small{color:var(--mut);font-size:12px}
.chip.on{border-color:var(--acc);background:rgba(255,79,139,.16)}
.seg{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-width:96px;padding:10px;border-radius:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-weight:500;color:var(--mut);font-size:12px}
.seg button.on{background:var(--acc);color:#fff}.seg button.on small{color:#ffe3ee}
.adult{display:flex;gap:10px;align-items:flex-start;background:rgba(255,194,61,.1);border:1px solid rgba(255,194,61,.4);padding:12px;border-radius:14px;cursor:pointer}
.adult input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin:0}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1200px;width:100%;margin:0 auto;flex-wrap:wrap}
#startHint{color:var(--mut);font-size:14px}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cform textarea{grid-column:1/-1;min-height:90px;resize:vertical}
.cform .btn{grid-column:1/-1}
.cform select,.cform textarea,#cjson{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--fg)}
#cjson{min-height:100px;font-family:ui-monospace,monospace;font-size:12px}
.ci{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:14px;padding:10px 12px}
.ci .tg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);white-space:nowrap;padding-top:3px}
.ci span:nth-child(2){flex:1;min-width:0}
details summary{cursor:pointer;font-weight:700}
/* ---------- écran de jeu ---------- */
#host{display:grid;grid-template-columns:1fr clamp(260px,24vw,360px);height:100vh;height:100dvh}
#stage{position:relative;overflow:hidden;background:var(--bg);min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:9;pointer-events:none}
.pill{pointer-events:auto;background:rgba(20,14,34,.85);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}
.pill.grow{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:18px}
.btnp{cursor:pointer;color:var(--fg)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none;padding:70px 24px 24px}
#ov .box{pointer-events:auto;max-width:100%;display:flex;justify-content:center;width:100%}
#mg{position:absolute;inset:0;z-index:8;background:radial-gradient(900px 600px at 50% 0%,#3a1d4f,transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 32px 32px;gap:18px;overflow:hidden}
#side{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:8px;overflow:auto;min-width:0}
.sp{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--panel);border:2px solid transparent;transition:border-color .2s,background .2s}
.sp.cur{border-color:var(--gold);background:var(--panel2)}
.sp.off{opacity:.55}
.rk{width:20px;font-weight:800;color:var(--mut);text-align:center;flex:none}
.spn{flex:1;min-width:0}.spn b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spn small{color:var(--mut);font-size:11px;display:block}
.scs{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}.cr,.jt{font-weight:800;font-size:17px;white-space:nowrap}.cr{color:var(--gold)}
.legend{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--mut);padding-top:12px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:50%;flex:none}
.sjoin{font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px;word-break:break-all}
.sjoin b{color:var(--fg)}
.card{--k:var(--acc);width:min(780px,100%);background:linear-gradient(165deg,var(--panel2),var(--panel));border:2px solid var(--k);border-radius:28px;padding:28px 34px;box-shadow:0 30px 90px rgba(0,0,0,.6);text-align:center;animation:flipin .6s cubic-bezier(.2,.9,.3,1)}
.card .tag{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--k);color:#140E22;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.card .txt{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:clamp(26px,3.1vw,44px);font-weight:700;line-height:1.15;margin:20px 0 6px;text-wrap:balance}
.foot{color:var(--mut);margin-top:14px;font-size:17px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.waitl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.wch{padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--mut);font-size:14px}
.wch.ok{background:rgba(61,220,132,.18);color:var(--green)}
.chip2{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--bg2);font-weight:700;margin:3px;font-size:17px;vertical-align:middle}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;text-align:left}.split h4{margin:0 0 6px;font-size:20px}
.olist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}.orow{display:flex;align-items:center;gap:4px}.orow b{color:var(--gold);font-size:20px}
.vbars{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left}
.vbar{display:flex;align-items:center;gap:10px}.vbar .lv{height:26px}
.banner{text-align:center;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.banner h1{font-size:clamp(48px,7vw,96px);font-weight:800;color:var(--gold);text-shadow:0 0 40px rgba(255,194,61,.45)}
.banner p{font-size:22px;margin-top:10px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:30;align-items:center;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:700;animation:pop .3s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#pause{position:absolute;inset:0;background:rgba(10,6,18,.82);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px;width:min(380px,100%);text-align:center}
.mghead{text-align:center;display:flex;align-items:center;gap:12px;justify-content:center}.mghead .ic{font-size:48px}.mghead h1{font-size:40px}
.mgintro{text-align:center;max-width:840px;display:flex;flex-direction:column;align-items:center;gap:12px}
.mgic{font-size:90px;line-height:1}
.mgk{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.mgintro h1{font-size:clamp(40px,5vw,72px)}
.mgintro p{font-size:22px;max-width:700px}
.vs{font-family:"Bricolage Grotesque",sans-serif;font-size:36px;color:var(--org);margin:0 12px;vertical-align:middle}
.mgb{width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:0;justify-content:center}
.big{font-size:clamp(22px,2.6vw,34px);font-weight:700;text-align:center}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-size:220px;font-weight:800;color:var(--gold);pointer-events:none;text-shadow:0 0 60px rgba(255,194,61,.5);z-index:3}
.cd:empty{display:none}
.pints{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.pint{display:flex;flex-direction:column;align-items:center;gap:8px}
.glass{width:90px;height:200px;border:4px solid rgba(255,255,255,.7);border-top:0;border-radius:0 0 18px 18px;position:relative;overflow:hidden;background:rgba(255,255,255,.05)}
.beer{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#FFD45E,#F0A020);transition:height .12s}
.cnt{font-size:28px;font-weight:800}
.rlist{display:flex;flex-direction:column;gap:8px;width:min(620px,100%)}
.rrow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:10px 16px;font-size:20px;border:2px solid transparent}
.rrow.win{border-color:var(--gold)}
.rp{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;width:34px;color:var(--gold)}
.rs{margin-left:auto;font-weight:800}.rr{min-width:130px;text-align:right;color:var(--gold);font-weight:800}
.mgres{display:flex;flex-direction:column;gap:10px;width:min(680px,100%)}
.mgres h2{text-align:center;font-size:40px;margin-bottom:8px}
.dots{position:relative;width:min(1000px,100%);height:min(56vh,560px);background:var(--bg2);border-radius:24px;border:1px solid var(--line)}
.dots i{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%)}
.dots .q{position:absolute;inset:0;display:grid;place-items:center;font-size:120px}
.lanes{display:flex;flex-direction:column;gap:10px;width:100%}
.lane{display:flex;align-items:center;gap:14px}.ln{width:230px;display:flex;align-items:center;gap:8px;font-size:20px;min-width:0;flex:none}.ln b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{--c:var(--acc);flex:1;height:34px;background:var(--bg2);border-radius:999px;overflow:hidden;position:relative}
.lv i{position:absolute;top:0;bottom:0;left:0;background:var(--c);border-radius:999px;transition:width .15s}
.lv span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:800}
.track{display:flex;flex-direction:column;gap:12px;width:100%}
.tr{position:relative;height:64px;background:repeating-linear-gradient(90deg,var(--bg2) 0 40px,var(--panel) 40px 80px);border-radius:16px}
.runner{position:absolute;top:50%;left:0;transform:translateY(-50%);display:flex;align-items:center;gap:4px;font-size:30px;transition:left .15s}
.flag{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:34px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(420px,52vh)}
.pad{aspect-ratio:1;border-radius:28px;background:var(--c);opacity:.22;transition:opacity .1s,transform .1s}
.pad.on{opacity:1;transform:scale(1.05);box-shadow:0 0 60px var(--c)}
.ungrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;width:100%}
.unc{background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:170px}
.unc b{font-family:"Bricolage Grotesque",sans-serif;font-size:48px}
.unc.win{outline:3px solid var(--gold);background:rgba(255,194,61,.12)}
.unc.dup{opacity:.55}
.podium{display:flex;align-items:flex-end;gap:16px;justify-content:center;margin-top:18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod small{color:var(--mut)}
.pod .blk{width:140px;border-radius:18px 18px 0 0;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-size:48px;font-weight:800;color:#140E22}
.pod .av{width:78px;height:78px;font-size:42px}
/* ---------- manette téléphone ---------- */
.ph{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(600px 400px at 50% -10%,#3a1d4f,transparent 70%),var(--bg);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.phh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:rgba(20,14,34,.75)}
.phh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px}
.phh .st{font-weight:800;white-space:nowrap}
.phm{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}
.phf{padding:6px 16px calc(6px + env(safe-area-inset-bottom));font-size:12px;color:var(--mut);text-align:center}
.center{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.center h2{font-size:28px}.center p{color:var(--mut);font-size:17px}
.ch{display:flex;flex-direction:column;gap:14px;margin:auto 0;width:100%}
.ch h2{font-size:26px;text-align:center}
.phcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:19px;font-weight:600;text-align:center;line-height:1.3}
.opts{display:grid;gap:10px}.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}
.ob{--oc:var(--panel2);min-height:64px;border-radius:18px;background:var(--oc);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border:2px solid transparent;text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0}
.ob span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ob:disabled{opacity:.4}.ob.sel{opacity:1;border-color:#fff;transform:scale(1.02)}
.opts.c3 .ob{font-size:30px;min-height:80px}
.tbar{height:6px;background:var(--panel);border-radius:9px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--gold);animation:tb linear forwards}
@keyframes tb{from{width:100%}to{width:0}}
.lob{display:flex;flex-direction:column;gap:10px}
.lob input,.lob select,.lob textarea,.codein{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;color:var(--fg)}
.lob textarea{min-height:80px}
.avbig{align-self:center}.avbig .av{width:100px;height:100px;font-size:56px;box-shadow:0 0 0 5px var(--c)}
.cols{display:flex;gap:8px;flex-wrap:wrap}.cols button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}.cols button.me{border-color:#fff}.cols button:disabled{opacity:.18}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.emos button{font-size:24px;padding:6px 0;border-radius:10px}.emos button.me{background:var(--panel2);outline:2px solid var(--acc)}
.addc{background:var(--panel);border-radius:14px;padding:12px}.addc[open]{display:flex;flex-direction:column;gap:8px}
.mg{display:flex;flex-direction:column;gap:14px;align-items:center;margin:auto 0;width:100%;text-align:center}
.mg h2{font-size:24px}
.cdp{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;font-weight:800;color:var(--gold);min-height:52px}
.tapbtn{width:min(78vw,320px);aspect-ratio:1;border-radius:50%;background:var(--acc);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;box-shadow:0 12px 0 #b02a5c;touch-action:none}
.tapbtn.hit{transform:translateY(6px);box-shadow:0 6px 0 #b02a5c}
.tapbtn:disabled{opacity:.4}
.rx{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;touch-action:none;z-index:5;padding:16px}

function netHostOpen(code){
 const st=t=>{H.net=t;const el=$('#netst');if(el)el.textContent=t};
 if(window.Peer&&!FORCE_LOCAL){
  NET={mode:'p2p'};let tries=0;
  const open=()=>{const peer=new Peer('latournee-'+code.toLowerCase()+'-h',{debug:0});NET.peer=peer;st('Connexion au serveur…');
   peer.on('open',()=>st('En ligne ✓ — les téléphones peuvent rejoindre'));
   peer.on('connection',c=>{c.on('data',d=>hostRecv(c,d));c.on('close',()=>{const p=c.pid&&G&&byId(c.pid);if(p&&p.conn===c){p.online=false;refreshPlayers()}});c.on('error',()=>{})});
   peer.on('disconnected',()=>{if(!peer.destroyed&&NET.peer===peer)setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
   peer.on('error',e=>{if(NET.peer!==peer)return;if(['unavailable-id','network','server-error','socket-error','socket-closed'].includes(e.type)){st(e.type==='unavailable-id'?'Code encore occupé, nouvel essai…':'Serveur de connexion injoignable, nouvel essai…');if(tries++<30){try{peer.destroy()}catch(_){}setTimeout(()=>{if(NET.peer===peer&&H.on)open()},3000)}}});
  };open();
 }else{
  NET={mode:'local',lc:{}};NET.bc=new BroadcastChannel('tournee-'+code);
  NET.bc.onmessage=e=>{const m=e.data;if(!m||m.to!=='host')return;let c=NET.lc[m.from];if(!c)c=NET.lc[m.from]={open:true,cid:m.from,send:d=>{try{NET.bc&&NET.bc.postMessage({to:m.from,from:'host',d})}catch(_){}},close(){}};hostRecv(c,m.d)};
  st('Mode local (test sur cet appareil)');
 }
}

function send(p,m){if(!p||p.bot)return;const c=p.conn;if(c&&c.open!==false)try{c.send(m)}catch(e){}}

const randBot=ex=>{const bs=G?G.P.filter(q=>q.bot&&q!==ex):[];return bs.length?pick(bs):null};
let SAYN=0;
function botLine(cat,v){const L=BL[cat],s=G.set;if(!L)return null;
 const ok=x=>{const m=/^([23D]):/.exec(x);if(!m)return true;return m[1]==='D'?!!s.drink:m[1]==='2'?s.lvl>=2:(s.lvl>=3||!!s.cats.hot)};
 let pool=L.filter(ok);if(!v||!v.n)pool=pool.filter(x=>!x.includes('{n}'));if(!pool.length)return null;
 const used=H.said||(H.said=[]),fr=pool.filter(x=>!used.includes(x)),l=pick(fr.length?fr:pool);used.push(l);if(used.length>40)used.shift();
 return l.replace(/^[23D]:/,'').replace(/\{n\}/g,v&&v.n||'')}
/* o: ch = probabilité, force = ignore l'attente, delay = ms */
function say(p,cat,v,o){o=o||{};if(!G||!p||!p.bot||!botMode())return;if(o.ch!=null&&Math.random()>o.ch)return;
 const n=Date.now();if(!o.force&&n<SAYN)return;const x=botLine(cat,v);if(!x)return;
 SAYN=n+(o.delay||0)+Math.max(3200,x.length*68);const g=GEN;setTimeout(()=>{if(G&&GEN===g&&G.P.includes(p))sayNow(p,x)},o.delay||0)}
function sayNow(p,x){
 if(G.nos)sendAll({t:'say',id:p.id,x});
 else{let el=$('#chat');if(!el){el=document.createElement('div');el.id='chat';document.body.appendChild(el)}
  const b=document.createElement('div');b.className='bub';b.style.setProperty('--c',p.color);b.innerHTML=`<span class="av s" style="--c:${p.color}">${avHTML(p)}</span><div><b>${esc(p.name)} 🤖</b><span>${esc(x)}</span></div>`;
  el.appendChild(b);while(el.children.length>3)el.firstChild.remove();const life=Math.max(4200,x.length*75);setTimeout(()=>b.classList.add('out'),life);setTimeout(()=>b.remove(),life+320)}
 if(botMode()===2)botSpeak(p,x)}
function botSpeak(p,x){try{const ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance==='undefined')return;
 const u=new SpeechSynthesisUtterance(x.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/«|»/g,''));u.lang='fr-FR';
 const vs=ss.getVoices().filter(v=>/^fr/i.test(v.lang));if(vs.length)u.voice=vs[(p.vi||0)%vs.length];
 u.pitch=p.vp||1;u.rate=(p.vr||1.1)*Math.min(1.6,Math.max(.8,SPEED||1));u.volume=1;if(ss.speaking||ss.pending)ss.cancel();ss.speak(u)}catch(e){}}
function botChatTick(){if(!G||!G.started||G.over||PAUSED||!botMode())return;const b=randBot();if(!b)return;
 const os=G.P.filter(q=>q!==b),t=os.length?pick(os):null;
 if(G.mgOn&&G.mgOn.includes(b.id)){const r=os.filter(q=>G.mgOn.includes(q.id));if(Math.random()<.55)say(b,'trash',r.length?{n:pick(r).name}:null)}

function hostRecv(c,d){
 if(!H.on||!G||!d||typeof d!=='object')return;
 if(d.t==='hello'){helloP(c,d);return}
 const p=c.pid&&byId(c.pid);if(!p)return;

function helloP(c,d){
 let p=d.pid&&byId(d.pid);
 if(!p&&G.started){const off=G.P.filter(q=>!q.online&&!q.bot);
  if(off.length&&!d.claim){c.send({t:'claim',ps:off.map(q=>({id:q.id,name:q.name,color:q.color,emoji:q.emoji}))});return}
  if(d.claim&&d.claim!=='new')p=byId(d.claim);}
 if(!p){if(G.P.length>=8){c.send({t:'full'});return}p=newPlayer({});G.P.push(p);if(G.started){G.order.push(p.id);toast(`${p.name} rejoint la partie`)}}
 if(p.conn&&p.conn!==c){try{p.conn.close()}catch(e){}}
 p.conn=c;c.pid=p.id;p.online=true;p.last=Date.now();
 c.send({t:'welcome',pid:p.id,code:G.code,nos:G.nos?1:0});H.lastScr=H.lastBrd=null;
 sendRoster();G.P.forEach(q=>{if(q.photo)send(p,{t:'photo',id:q.id,photo:q.photo})});sendMe(p);
 if(!G.started){setView(p,lobbyView());broadcastLobby()}else if(p.view)send(p,{t:'v',v:p.view});else setView(p,{k:'msg',title:'Partie en cours',sub:'Ton tour arrive, regarde l’écran.'});
 refreshPlayers();
}
const lobbyView=()=>({k:'lobby',taken:G.P.map(p=>p.color)});
function broadcastLobby(){if(!G.started)G.P.forEach(p=>setView(p,lobbyView()))}
function profP(p,d){
 if(typeof d.name==='string'){const n=d.name.replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,14);if(n)p.name=n}
 if(COLORS.includes(d.color)&&!G.P.some(q=>q!==p&&q.color===d.color))p.color=d.color;
 if(EMOJIS.includes(d.emoji))p.emoji=d.emoji;
 if(typeof d.ch==='string'){const c=CHARS.find(x=>x[0]===d.ch);if(c){p.ch=c[0];p.emoji=c[2]}}
 if('photo' in d){if(d.photo===null)p.photo=null;else if(okPhoto(d.photo))p.photo=d.photo;sendPhoto(p)}

 if(PEND[p.id])PEND[p.id].done(PEND[p.id].def);

async function gameLoop(){
 while(G.round<=G.set.rounds){
  if(G.ti===0){const hs=heatUp();save();await banner(`Tour ${G.round} / ${G.set.rounds}`,[G.round===G.set.rounds?'Dernier tour !':'',hs].filter(Boolean).join(' · '));if(G.set.rounds>=6&&G.round===G.set.rounds-2)await lastCall()}
  while(G.ti<G.order.length){const p=byId(G.order[G.ti]);if(p){save();await playerTurn(p)}G.ti++}
  save();await miniGameRound();G.round++;G.ti=0;
 }
 await endGame();
}

 if(G.set.map!=='appart')return'';const pr=prog(),nl=pr<.34?1:pr<.67?2:3,up=nl>G.set.lvl&&G.round>1;G.set.lvl=nl;G.set.cats.hot=pr>=.5?1:0;G.set.cats.dr=pr>=.7?1:0;

function drawCard(t,p){const s=G.set,all=CARDS.concat(MYC);const ok=c=>c.t===t&&s.cats[c.c]&&c.l<=s.lvl;

 if(!pool.length){all.filter(ok).forEach(c=>delete G.used[c.id]);pool=all.filter(ok)}
 if(!pool.length)pool=CARDS.filter(c=>c.t===t&&c.c==='cl'&&c.l<=s.lvl);
 if(!pool.length)pool=CARDS.filter(c=>c.t===t&&c.c==='cl');
 const w=pool.map(c=>c.c==='perso'?3:c.l===s.lvl?2.5:1);let r=Math.random()*w.reduce((a,b)=>a+b,0),card=pool[0];for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){card=pool[i];break}}
 G.used[card.id]=1;const os=others(p);const X=os.length?pick(os).name:'quelqu’un';
 return Object.assign({},card,{x:card.x.replace(/\{X\}/g,X)})}

function drawBank(bank){const s=G.set,ok=c=>s.cats[c.c]&&c.l<=s.lvl;let pool=bank.filter(c=>ok(c)&&!G.used[c.id]);
 if(!pool.length){bank.filter(ok).forEach(c=>delete G.used[c.id]);pool=bank.filter(ok)}
 if(!pool.length)pool=bank.filter(c=>c.c==='cl'&&c.l===1);
 const card=wpick(pool,pool.map(c=>c.l===s.lvl?2.5:1));G.used[card.id]=1;return card}

 const pred=+(await askChoice(p,{title:'Combien vont répondre OUI ?',sub:card.x+' (toi compris)',opts:Array.from({length:N+1},(_,i)=>({id:String(i),l:String(i)})),cols:3,timer:30,def:String(ri(0,N)),buzz:1}));

 const a=await askAll(ps,()=>({title:'Sondage anonyme 🤫',sub:card.x+' — personne ne verra ta réponse.',opts:[{id:'y',l:'Oui',c:'#D83A72'},{id:'n',l:'Non',c:'#3E6FD8'}]}),25,'n',wl);

function mgOK(k){const m=MG[k];if(m.weed&&G.set.map!=='coffee')return false;if(m.hot&&!G.set.cats.hot)return false;if(m.vice&&!(G.set.drink||G.set.lvl>=2))return false;return true}

function mgHide(){const m=$('#mg');if(m){m.hidden=true;m.innerHTML=''}}
const mgHead=m=>`<div class="mghead"><span class="ic">${m.ic}</span><h1>${m.n}</h1></div>`;

function botTick(ps,fn,every){const bs=ps.filter(p=>p.bot);if(!bs.length)return()=>{};const id=setInterval(()=>{if(!PAUSED)bs.forEach(fn)},every/SPEED);return()=>clearInterval(id)}
function rankBy(ps,s,dir){const ids=ps.map(p=>p.id).sort((a,b)=>dir*(s[a]-s[b]));const out=[];let prev;ids.forEach(id=>{if(out.length&&s[id]===prev)out[out.length-1].push(id);else out.push([id]);prev=s[id]});return out}
const active=p=>p.online||p.bot;
const scMap=(ps,f)=>Object.fromEntries(ps.map(p=>[p.id,f(p)]));
async function runMG(g,ids,duel){const m=MG[g],ps=ids.map(byId).filter(Boolean);
 stMsg(duel?`Duel : ${ps.map(p=>p.name).join(' contre ')}`:`Mini-jeu : ${m.n}`);
 mgShow(`<div class="mgintro"><div class="mgic">${m.ic}</div><div class="mgk">${duel?'Duel':m.team?'Mini-jeu · '+m.team:'Mini-jeu · tout le monde'}${m.arena?' · 3D':''}</div><h1>${m.n}</h1><p>${m.r}</p><div>${ps.map(chip).join(duel?'<b class="vs">VS</b>':'')}</div><div class="foot">Touchez « Je suis prêt » sur votre téléphone</div>${WLF}</div>`);
 sfx('card');
 G.P.filter(q=>!ids.includes(q.id)).forEach(q=>setView(q,{k:'msg',title:'Duel en cours ⚔',sub:`${ps.map(p=>p.name).join(' contre ')} à « ${m.n} ». Regarde l’écran !`}));
 await askAll(ps.filter(active),()=>({title:m.n,sub:m.r,opts:[{id:'ok',l:'✋ Je suis prêt',c:'#1E9E5A'}]}),30,'ok',wl);
 {const b=pick(ps.filter(q=>q.bot));if(b)say(b,'mgstart',null,{ch:.5})}
 G.mgOn=ps.map(q=>q.id);let res;try{res=await m.run(ps)}finally{G.mgOn=null}G.mgIn=null;return res}
async function mgResults(res,title,lab){let pos=0;const rows=[];
 res.rank.forEach(gr=>{gr.forEach(id=>{const p=byId(id);if(!p)return;rows.push(`<div class="rrow ${pos===0?'win':''}"><span class="rp">${pos+1}</span>${chip(p)}<span class="rs">${esc(res.sc[id]||'')}</span><span class="rr">${lab?lab(id,pos):''}</span></div>`);setView(p,{k:'msg',title:pos===0?'🏆 1er !':`${pos+1}e`,sub:(res.sc[id]||'')+(lab&&lab(id,pos)?' · '+lab(id,pos).replace(/<[^>]+>/g,''):'')})});pos+=gr.length});
 mgShow(`<div class="mgres"><h2>${title}</h2>${rows.join('')}<div class="foot" style="text-align:center">Espace pour continuer</div></div>`);sfx('win');
 {const w=res.rank[0]||[],all=res.rank.flat(),lw=res.rank.length>1?res.rank[res.rank.length-1]:[],wb=w.map(byId).filter(q=>q&&q.bot),lb=lw.map(byId).filter(q=>q&&q.bot),wn=byId(w[0]);
  if(wb.length&&(Math.random()<.6||!lb.length))say(pick(wb),'win',null,{force:1,delay:500});else if(lb.length)say(pick(lb),'lose',wn&&!wn.bot?{n:wn.name}:null,{force:1,delay:500})}
 await wait(6500,true);mgHide()}

 G.lastMG=(G.lastMG||[]).concat(g).slice(-6);

 if(G.set.drink&&res.rank.length>1)res.rank[res.rank.length-1].forEach(id=>{const p=byId(id);if(p){pen(p,1);rw[id]=(rw[id]?rw[id]+' · ':'')+'🍺 1 gorgée'}});

function decorArena(sc,k,lite){const fs=[];const R=(a,b)=>a+Math.random()*(b-a);
 const around=(n,f)=>{for(let i=0;i<n;i++){const a=i/n*Math.PI*2,o=f(i);o.position.set(Math.cos(a)*13.5,0,Math.sin(a)*9.5);sc.add(o)}};

 else if(k==='bistrot')around(lite?6:10,()=>{const t=tree3();t.scale.setScalar(R(1,1.5));return t});
 else if(k==='club'){const cols=['#ff3ad0','#3ad1ff','#ffe03a','#7aff5a'];const ls=cols.map(c=>{const l=new THREE.PointLight(c,lite?14:24,14,2);sc.add(l);return l});fs.push(t=>ls.forEach((l,i)=>{const a=t+i/4*Math.PI*2;l.position.set(Math.cos(a)*8,4,Math.sin(a)*5)}))}
 else if(k==='suite'){const ls=[];for(let i=0;i<8;i++){const f=spr(softTex(),.6,.9);f.material.color.set('#ffb040');f.material.blending=THREE.AdditiveBlending;const a=i/8*Math.PI*2;f.position.set(Math.cos(a)*12,.6,Math.sin(a)*8);sc.add(f);ls.push(f)}const L=new THREE.PointLight('#ff6a9a',lite?14:24,20,2);L.position.set(0,5,0);sc.add(L);fs.push(t=>ls.forEach((f,i)=>f.scale.y=.9+Math.sin(t*12+i)*.1))}
 else if(k==='appart'){const L=new THREE.PointLight('#ffd8a0',lite?16:26,22,2);L.position.set(0,6,0);sc.add(L)}
 return t=>fs.forEach(f=>f(t))}
